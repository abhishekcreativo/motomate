name: Bug report
description: Something in MotoMate is not working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > About, or the Play Store listing
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help most.
    validations:
      required: true
